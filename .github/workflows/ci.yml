name: ci
on:
  push:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run size --if-present
      - name: dist freshness (commit built dist)
        shell: bash
        run: git diff --exit-code dist || (echo "STALE DIST: run npm run build and commit dist/" && exit 1)
      - name: size gate (dist <200KB)
        shell: bash
        run: |
          node -e "const fs=require('fs');let t=0;for(const f of fs.readdirSync('dist')){try{t+=fs.statSync('dist/'+f).size}catch{}};const kb=Math.round(t/1024);console.log('dist size '+kb+'KB');if(kb>200){console.error('SIZE GATE FAIL: dist '+kb+'KB >200KB');process.exit(1)}"
